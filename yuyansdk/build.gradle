import java.text.SimpleDateFormat

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlinx-serialization'

def versionNameDate() {
    return new SimpleDateFormat("yyyyMMddHH").format(new Date())
}

def getAppGitHead() {
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (Exception e) {
        return "unknow"
    }
}

def getAppBuildTime() {
    return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date())
}

android {
    compileSdk 36
    namespace 'com.yuyan.imemodule'
    defaultConfig {
        minSdk 23
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }

        lintOptions {
            abortOnError false
        }

        buildConfigField "String", "versionName", "\"${versionNameDate()}\""
        buildConfigField "String", "AppCommitHead", "\"${getAppGitHead()}\""
        buildConfigField "String", "AppBuildTime", "\"${getAppBuildTime()}\""
    }

    //多渠道打包: app中多渠道配置要一致
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension "default"
            buildConfigField "Boolean", "offline", "true"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
        aidl = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            resValue("string", "app_name", "@string/ime_yuyan_name")
            resValue("drawable", "app_icon", "@drawable/ic_sdk_launcher")
        }
        debug {
            resValue("string", "app_name", "@string/ime_yuyan_name_debug")
            resValue("drawable", "app_icon", "@drawable/ic_sdk_launcher_debug")
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        offline {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    //第三方库使用java1.8
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'com.github.promeg:tinypinyin:2.0.3' // TinyPinyin核心包，速度天花板

    implementation 'com.github.open-android:pinyin4j:2.5.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'

    kapt 'com.alibaba:arouter-compiler:1.5.2'
    implementation 'com.alibaba:arouter-api:1.5.2'
    implementation 'com.github.getActivity:XXPermissions:20.0'
    implementation 'com.github.promeG:TinyPinyin:2.0.3'

    // Kotlin 依赖项
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Emoji2, Flexbox, Exif
    implementation 'androidx.emoji2:emoji2:1.4.0'
    implementation 'androidx.emoji2:emoji2-views:1.4.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Splitties View DSL
    def splitties_version = "3.0.0"
    implementation "com.louiscad.splitties:splitties-fun-pack-android-material-components:$splitties_version"
    implementation "com.louiscad.splitties:splitties-views-dsl-constraintlayout:$splitties_version"
    implementation "com.louiscad.splitties:splitties-views-dsl-material:$splitties_version"
    implementation "com.louiscad.splitties:splitties-views-material:$splitties_version"

    // Jetpack Compose 依赖项
    def compose_version = "1.7.5"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"

    // AndroidX Navigation
    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // AndroidX Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // AndroidX Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}

kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}
